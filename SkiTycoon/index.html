<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkiTycoon</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">SkiTycoon</p>
        <h1>Alpen-Resort-Gruppe</h1>
        <p id="headline-status" class="muted">Baue dein Skigebiets-Imperium auf.</p>
      </div>
      <div class="topbar-actions">
        <button class="ghost-btn" data-action="speed" data-speed="1">1x</button>
        <button class="ghost-btn" data-action="speed" data-speed="3">3x</button>
        <button class="ghost-btn" data-action="save">Speichern</button>
      </div>
    </header>

    <section id="stats-grid" class="stats-grid"></section>

    <nav class="tabs">
      <button class="tab active" data-action="tab" data-tab="overview">Übersicht</button>
      <button class="tab" data-action="tab" data-tab="build">Bauen</button>
      <button class="tab" data-action="tab" data-tab="research">Forschung</button>
      <button class="tab" data-action="tab" data-tab="operations">Betrieb</button>
      <button class="tab" data-action="tab" data-tab="regions">Gebiete</button>
      <button class="tab" data-action="tab" data-tab="events">Events</button>
      <button class="tab" data-action="tab" data-tab="settings">Settings</button>
    </nav>

    <main id="view" class="view"></main>
  </div>

  <script src="./game.js"></script>
</body>
</html>
