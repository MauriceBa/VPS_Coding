<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎈 BTD6 Profil | mauricelol.fun</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #ef4444;
            --accent: #eab308;
            --bg: #0f172a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        #scroll-progress {
            position: fixed; top: 0; left: 0; height: 3px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            z-index: 9999; width: 0%; transition: width 0.05s linear;
        }

        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }

        header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-height);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 2rem; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border);
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-decoration: none; transition: transform 0.3s;
        }
        .logo:hover { transform: scale(1.05); }

        .nav-group { display: flex; align-items: center; gap: 0.75rem; }
        .nav-link {
            color: var(--text); text-decoration: none; font-weight: 500;
            padding: 0.5rem 1rem; border-radius: 8px; transition: all 0.2s;
            border: 1px solid transparent; background: rgba(255,255,255,0.03);
        }
        .nav-link:hover, .nav-link.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary); color: var(--primary);
        }

        main {
            max-width: 1400px; margin: calc(var(--header-height) + 4rem) auto 2rem;
            padding: 0 2rem; position: relative; z-index: 1;
        }

        .hero { text-align: center; margin-bottom: 3rem; animation: slideUp 0.8s ease-out; }
        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 800; margin-bottom: 0.75rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .subtitle { font-size: 1.05rem; color: var(--text-muted); }

        .stats-bar {
            display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap;
            margin: 0 auto 3rem; animation: slideUp 0.8s ease-out 0.15s backwards;
        }
        .stat-item { text-align: center; }
        .stat-number {
            font-size: 2.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1;
        }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 0.4rem; }

        .section-title {
            font-size: 1.8rem; font-weight: 700; margin: 3rem 0 1.5rem;
            color: var(--text); display: flex; align-items: center; gap: 0.5rem;
        }

        .grid-3 {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem; margin-bottom: 3rem; animation: slideUp 0.8s ease-out 0.2s backwards;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 1.5rem; backdrop-filter: blur(10px);
            position: relative; overflow: hidden; transition: all 0.3s;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(59, 130, 246, 0.4); box-shadow: 0 12px 30px -8px rgba(59, 130, 246, 0.2); }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(to right, var(--primary), var(--secondary)); opacity: 0.7;
        }
        .card-header { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
        .card-icon { font-size: 1.4rem; }
        .card-title { font-weight: 700; color: var(--text); font-size: 1.1rem; }

        .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .stat-row .lbl { color: var(--text-muted); }
        .stat-row .val { font-weight: 600; color: var(--text); text-align: right; }

        .hero-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
        }
        .hero-item {
            background: rgba(255,255,255,0.05); padding: 0.75rem; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .hero-name { font-size: 0.9rem; color: var(--text); }
        .hero-count { font-weight: 700; color: var(--accent); }

        #error-msg { color: var(--secondary); font-weight: bold; text-align: center; margin: 2rem 0; display: none; }

        footer { margin-top: 6rem; padding: 2rem; text-align: center; color: var(--text-muted); border-top: 1px solid var(--card-border); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) { .stats-bar { gap: 1.5rem; } .stat-number { font-size: 2rem; } }
    </style>
</head>
<body>
    <div id="scroll-progress"></div>
    <canvas id="bg-canvas"></canvas>

    <header>
        <a href="/" class="logo">mauricelol.fun</a>
        <div class="nav-group">
            <a href="/" class="nav-link">🏠 Home</a>
            <a href="/plan-des-pistes/" class="nav-link">🎿 Pistenpläne</a>
            <a href="/untappd/" class="nav-link">🍺 Bier</a>
            <a href="/btd6/" class="nav-link active">🎈 BTD6</a>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>🎈 Bloons TD 6 Profil</h1>
            <p class="subtitle">Live-Daten direkt über die Ninja Kiwi Open Data API ausgelesen</p>
        </div>

        <div id="error-msg">⚠️ API konnte nicht geladen werden. Bitte später erneut versuchen.</div>

        <div class="stats-bar" id="highlights"></div>

        <div id="gameplay-section"></div>
        <div id="bloons-section"></div>
        <div id="towers-section"></div>
        <div id="heroes-section"></div>
        <div id="achievements-section"></div>
    </main>

    <footer>
        <p>&copy; 2026 MauriceBa. Not affiliated with Ninja Kiwi.</p>
    </footer>

    <script>
        const OAK_KEY = "oak_22b8220d7e5253073845";
        const API_URL = `https://data.ninjakiwi.com/btd6/users/${OAK_KEY}`;
        
        const fmtNum = (v) => (typeof v === "number" && Number.isFinite(v)) ? new Intl.NumberFormat('de-DE').format(v) : v;

        function statRow(label, value) {
            if (value === undefined || value === null || value === 0 || value === "0" || value === "") return "";
            return `<div class="stat-row"><span class="lbl">${label}</span><span class="val">${fmtNum(value)}</span></div>`;
        }

        function createCard(title, icon, content) {
            return `<div class="card">
                <div class="card-header">
                    <span class="card-icon">${icon}</span>
                    <span class="card-title">${title}</span>
                </div>
                ${content}
            </div>`;
        }

        function createHeroGrid(heroes) {
            const sorted = Object.entries(heroes)
                .filter(([_, v]) => typeof v === "number" && v > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            if (sorted.length === 0) return "";
            
            const items = sorted.map(([name, count]) => 
                `<div class="hero-item">
                    <span class="hero-name">${name}</span>
                    <span class="hero-count">${fmtNum(count)}x</span>
                </div>`
            ).join('');
            
            return `<div class="hero-grid">${items}</div>`;
        }

        function createTowerGrid(towers) {
            const sorted = Object.entries(towers)
                .filter(([_, v]) => typeof v === "number" && v > 0)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 15);
            
            if (sorted.length === 0) return "";
            
            const items = sorted.map(([name, count]) => 
                `<div class="hero-item">
                    <span class="hero-name">${name.replace('Monkey', '').replace('Beast', '')}</span>
                    <span class="hero-count">${fmtNum(count)}x</span>
                </div>`
            ).join('');
            
            return `<div class="hero-grid">${items}</div>`;
        }

        async function fetchBTD6Data() {
            try {
                const res = await fetch(API_URL); 
                if (!res.ok) throw new Error("Network response was not ok"); 
                
                const data = await res.json(); 
                const body = data.body || data;
                
                const rank = body.rank || body.level || "--";
                const vetRank = body.veteranRank || 0;
                const mm = body.monkeyMoney || 0;
                const username = body.displayName || body.name || "RiiFT";
                const avatarURL = body.avatarURL || "";
                
                // Highlights
                let highlightsHTML = `
                    <div class="stat-item">
                        <div class="stat-number">${username}</div>
                        <div class="stat-label">Spieler</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number">${rank} ${vetRank > 0 ? `<span style="font-size:1.2rem; color:var(--accent)">+${vetRank}</span>` : ''}</div>
                        <div class="stat-label">Rang</div>
                    </div>`;
                
                if (mm > 0) highlightsHTML += `
                    <div class="stat-item">
                        <div class="stat-number" style="color: var(--accent);">${fmtNum(mm)}</div>
                        <div class="stat-label">Monkey Money 💰</div>
                    </div>`;
                
                if (body.bloonsPopped && body.bloonsPopped.bloonsPopped) {
                    highlightsHTML += `
                    <div class="stat-item">
                        <div class="stat-number" style="color: var(--secondary);">${fmtNum(body.bloonsPopped.bloonsPopped)}</div>
                        <div class="stat-label">Bloons Popped 🎈</div>
                    </div>`;
                }
                
                if (body.gameplay && body.gameplay.gameCount) {
                    highlightsHTML += `
                    <div class="stat-item">
                        <div class="stat-number">${fmtNum(body.gameplay.gameCount)}</div>
                        <div class="stat-label">Spiele</div>
                    </div>`;
                }
                
                document.getElementById('highlights').innerHTML = highlightsHTML;

                // Gameplay Stats
                if (body.gameplay) {
                    const g = body.gameplay;
                    let gameplayRows = 
                        statRow("Gespielte Spiele", g.gameCount) +
                        statRow("Gewonnene Spiele", g.gamesWon) +
                        statRow("Höchste Runde", g.highestRound) +
                        statRow("Höchste Runde CHIMPS", g.highestRoundCHIMPS) +
                        statRow("Cash verdient", g.cashEarned) +
                        statRow("Monkeys platziert", g.monkeysPlaced) +
                        statRow("Fähigkeiten genutzt", g.abilitiesUsed) +
                        statRow("Powers genutzt", g.powersUsed) +
                        statRow("Coop Cash gegeben", g.coopCashGiven) +
                        statRow("Trophäen verdient", g.totalTrophiesEarned) +
                        statRow("Odysseen abgeschlossen", g.totalOdysseysCompleted) +
                        statRow("Odyssee-Sterne", g.totalOdysseyStars) +
                        statRow("Monkey Teams Siege", g.monkeyTeamsWins);
                    
                    document.getElementById('gameplay-section').innerHTML = createCard("Gameplay Stats", "⚔️", gameplayRows);
                }

                // Bloons Popped Stats
                if (body.bloonsPopped) {
                    const b = body.bloonsPopped;
                    let bloonsRows = 
                        statRow("Gesamt Bloons", b.bloonsPopped) +
                        statRow("Bloons gelassen", b.bloonsLeaked) +
                        statRow("Ceramics", b.ceramicsPopped) +
                        statRow("MOABs", b.moabsPopped) +
                        statRow("BFBs", b.bfbsPopped) +
                        statRow("DDTs", b.ddtsPopped) +
                        statRow("BADs", b.badsPopped) +
                        statRow("ZOMGs", b.zomgsPopped) +
                        statRow("Camo Bloons", b.camosPopped) +
                        statRow("Lead Bloons", b.leadsPopped) +
                        statRow("Regrows", b.regrowsPopped) +
                        statRow("Golden Bloons", b.goldenBloonsPopped) +
                        statRow("Bosses", b.bossesPopped) +
                        statRow("Necro Bloons", b.necroBloonsReanimated) +
                        statRow("Coop Bloons", b.coopBloonsPopped);
                    
                    document.getElementById('bloons-section').innerHTML = createCard("Bloons Popped", "🎈", bloonsRows);
                }

                // Towers Placed
                if (body.towersPlaced) {
                    const towerGrid = createTowerGrid(body.towersPlaced);
                    if (towerGrid) {
                        document.getElementById('towers-section').innerHTML = createCard("Towers Placed (Top 15)", "🏹", towerGrid);
                    }
                }

                // Heroes Placed
                if (body.heroesPlaced) {
                    const heroGrid = createHeroGrid(body.heroesPlaced);
                    if (heroGrid) {
                        document.getElementById('heroes-section').innerHTML = createCard("Heroes Placed (Top 10)", "🦸‍♂️", heroGrid);
                    }
                }

                // Achievements & Medals
                let medalRows = 
                    statRow("Achievements", body.achievements) +
                    statRow("Daily Rewards", body.dailyRewards) +
                    statRow("Black Borders", body.blackBorders) +
                    statRow("Gold Borders", body.goldBorders) +
                    statRow("Insta Monkeys (Collection)", body.instaMonkeyCollection) +
                    statRow("Insta Monkeys (Used)", body.instaMonkeysUsed) +
                    statRow("Höchste Runde", body.highestRound) +
                    statRow("Boss Damage", body.damageDoneToBosses ? fmtNum(body.damageDoneToBosses) : undefined) +
                    statRow("Most Experienced", body.mostExperiencedMonkey ? body.mostExperiencedMonkey.replace('Monkey', '') : undefined);
                
                document.getElementById('achievements-section').innerHTML = createCard("Erfolge & Medaillen", "🏆", medalRows);

            } catch(err) { 
                console.error(err); 
                document.getElementById('error-msg').style.display = 'block'; 
                document.getElementById('highlights').style.display = 'none'; 
            }
        }

        fetchBTD6Data();

        // Background Particles
        const canvas = document.getElementById('bg-canvas'); 
        const ctx = canvas.getContext('2d'); 
        let width, height, particles = [];
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        }
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * -1 - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
                const colors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y < -10) this.y = height + 10;
                if (this.x < -10) this.x = width + 10;
                if (this.x > width + 10) this.x = -10;
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(this.x, this.y, this.size, this.size * 1.2, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function initParticles() {
            particles = [];
            const count = Math.floor((width * height) / 10000);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }
        
        function animate() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            requestAnimationFrame(animate);
        }
        resize();
        animate();
    </script>
</body>
</html>
